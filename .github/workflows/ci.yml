name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        preset: [release, release-checked, asan-ubsan, tsan]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ninja
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            brew install ninja
          else
            sudo apt-get update && sudo apt-get install -y ninja-build
          fi

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No floating point below apps/
        run: ./tools/check_no_float.sh
