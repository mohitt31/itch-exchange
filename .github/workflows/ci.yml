name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        preset: [release, release-checked, asan-ubsan, tsan]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ninja
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            brew install ninja
          else
            sudo apt-get update && sudo apt-get install -y ninja-build
          fi

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      # A9: the ten-run determinism claim is asserted here, not checked by hand.
      # test_determinism replays a synthetic session ten times, through all
      # three book implementations, at four validation intervals, and requires
      # one digest. It runs as part of ctest above; this re-runs it alone so a
      # failure is unambiguous in the log rather than one line among twelve.
      - name: Determinism
        run: ./build/${{ matrix.preset }}/tests/test_determinism

  benchmarks-build:
    # The benchmarks are part of the project, so they have to keep compiling.
    # They are not run here: a shared CI runner cannot produce a number worth
    # having, and publishing one would undercut everything NUMBERS.md says about
    # measurement conditions.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install ninja
      - run: cmake --preset release
      - run: cmake --build --preset release

  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No floating point below apps/
        run: ./tools/check_no_float.sh
      - name: Headers are self-contained
        run: ./tools/check_headers_selfcontained.sh
      - name: No noexcept function contains an assertion
        run: ./tools/check_noexcept_asserts.sh
      - name: Generated wire headers are up to date
        run: |
          mkdir -p /tmp/gen
          python3 tools/gen_wire.py tools/itch50_fields.json /tmp/gen
          diff -u include/itch/wire/messages.hpp /tmp/gen/messages.hpp
          diff -u include/itch/wire/views.hpp /tmp/gen/views.hpp
